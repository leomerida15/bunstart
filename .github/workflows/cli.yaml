name: Deploy CLI Package

on:
    push:
        branches: [cli/main]

jobs:
    deploy:
        name: Build & publish CLI
        runs-on: ubuntu-latest

        steps:
            - name: 📦 Checkout repo
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Set up Node (for npm publish registry auth)
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  registry-url: 'https://registry.npmjs.org'

            - name: 📥 Install dependencies
              run: bun install

            - name: 🔄 Replace workspace:* with latest @bunstart/pack
              run: |
                  VERSION=$(bun pm ls @bunstart/pack 2>/dev/null | grep -oP '\d+\.\d+\.\d+' | head -1 || echo "0.2.4")
                  echo "Using @bunstart/pack version: $VERSION"
                  sed -i "s/\"workspace:\*\"/\"^$VERSION\"/g" packages/cli/package.json
                  bun install

            - name: 🛠️ Build packages
              run: |
                  bun run --filter '@bunstart/pack' build
                  bun run --filter '@bunstart/cli' build

            - name: 🚀 Publish CLI to npm
              uses: JS-DevTools/npm-publish@v1
              with:
                  token: ${{ secrets.NPM_TOKEN }}
                  package: packages/cli/package.json
                  access: public