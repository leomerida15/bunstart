name: Deploy Pack Package

on:
    push:
        branches: [pack/main]

jobs:
    deploy:
        name: Build & publish Pack
        runs-on: ubuntu-latest

        steps:
            - name: 📦 Checkout repo
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.10

            - name: Set up Node (for npm publish registry auth)
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  registry-url: 'https://registry.npmjs.org'

            - name: 📥 Install dependencies
              run: bun install --frozen-lockfile

            - name: 🛠️ Build @bunstart/pack
              run: bun run --filter '@bunstart/pack' build

            - name: 🚀 Publish @bunstart/pack to npm
              run: npm publish --access public
              working-directory: packages/pack
              continue-on-error: true
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}