name: Deploy Packages

on:
    push:
        branches: [pack/main]

jobs:
    deploy-pack:
        name: Build & publish @bunstart/pack
        runs-on: ubuntu-latest

        steps:
            - name: 📦 Checkout repo
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.10

            - name: Set up Node (for npm publish registry auth)
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  registry-url: 'https://registry.npmjs.org'

            - name: 📥 Install dependencies
              run: bun install --frozen-lockfile

            - name: 🛠️ Build @bunstart/pack
              run: bun run --filter '@bunstart/pack' build

            - name: 🚀 Publish @bunstart/pack to npm
              run: npm publish --access public
              working-directory: packages/pack
              continue-on-error: true
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    deploy-cli:
        name: Build & publish @bunstart/cli
        runs-on: ubuntu-latest
        needs: deploy-pack

        steps:
            - name: 📦 Checkout repo
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.10

            - name: Set up Node (for npm publish registry auth)
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  registry-url: 'https://registry.npmjs.org'

            - name: 📥 Install dependencies
              run: bun install --frozen-lockfile

            - name: 🛠️ Build CLI
              run: bun run --filter '@bunstart/cli' build

            - name: 🚀 Publish CLI to npm
              run: npm publish --access public
              working-directory: packages/cli
              continue-on-error: true
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    sync-skills:
        name: Sync skills to bunstart-skills
        runs-on: ubuntu-latest
        needs: [deploy-pack, deploy-cli]

        steps:
            - name: 📦 Checkout main repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 🔧 Configure Git
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"

            - name: 📦 Checkout skills repo
              uses: actions/checkout@v4
              with:
                  repository: leomerida15/bunstart-skills
                  path: bunstart-skills
                  fetch-depth: 0

            - name: 📁 Copy skill files
              run: |
                  # bunstart skill
                  mkdir -p bunstart-skills/skills/bunstart
                  cp .opencode/skills/bunstart/SKILL.md bunstart-skills/skills/bunstart/
                  
                  # bunstart-rules skill
                  mkdir -p bunstart-skills/skills/bunstart-rules
                  cp .opencode/skills/bunstart-rules/SKILL.md bunstart-skills/skills/bunstart-rules/
                  
                  if [ -f "skills/bunstart/README.md" ]; then
                      cp skills/bunstart/README.md bunstart-skills/
                  fi

            - name: 🔄 Commit and push changes
              working-directory: bunstart-skills
              run: |
                  git add .
                  
                  if git diff --cached --quiet; then
                      echo "✅ No changes to sync"
                      exit 0
                  fi
                  
                  git commit -m "sync: update skills from bunstart repo
                  
                  Automated sync from bunstart repository.
                  $(git log -1 --pretty=%B main | head -3)"
                  
                  git push origin main
                  echo "✅ Skills synced to bunstart-skills"